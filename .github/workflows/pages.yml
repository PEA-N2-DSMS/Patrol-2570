name: Deploy Dashboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: node --check app.js && node --check network.js && node scripts/test_network.js
      - name: Prepare website
        run: |
          mkdir _site
          cp index.html style.css app.js data.js network.js _site/
          cp -R vendor _site/vendor
      - name: Cache approximate road geometry for SZA01
        run: python3 scripts/build_roads.py --output _site/road-network.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
